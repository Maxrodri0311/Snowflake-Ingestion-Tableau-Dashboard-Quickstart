name: CI & Survival Analytics Invariants

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run Full Pytest Suite (Domain, Survival, Lakehouse & Invariants)
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v

    - name: Execute Quantitative Micro-Benchmarks (50k Contracts)
      env:
        PYTHONPATH: .
      run: |
        python tests/benchmark.py

    - name: Archive Benchmark & Telemetry Artifacts
      uses: actions/upload-artifact@v4
      if: matrix.python-version == '3.11'
      with:
        name: enterprise-telemetry-artifacts
        path: |
          artifacts/benchmark.json
          artifacts/snowflake_deployment.sql
