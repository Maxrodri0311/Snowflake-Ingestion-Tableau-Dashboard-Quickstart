[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inetum-contract-survival-analytics-engine"
version = "1.0.0"
description = "Enterprise Contract Survival & Lifecycle Analytics Engine for B2B Technology Portfolios"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Maximiliano Rodriguez", email = "maxrodri0311@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "lifelines>=0.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[project.urls]
Homepage = "https://github.com/Maxrodri0311/inetum-contract-survival-analytics-engine"
Repository = "https://github.com/Maxrodri0311/inetum-contract-survival-analytics-engine"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
